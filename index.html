<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web - Pagos y Servicios</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px #ccc;
        }
        h1 {
            color: #1a2a3a;
            margin-bottom: 15px;
        }
        p {
            line-height: 1.6;
            color: #555;
            font-size: 1.1em;
        }
        .services {
            margin: 25px 0;
            text-align: left;
            background: #f9fbfd;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #0070ba;
        }
        .payment-box {
            margin-top: 25px;
            padding: 20px;
            background: #fff;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
        }
        .paypal-btn {
            display: inline-block;
            margin-top: 10px;
            background-color: #0070ba;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1em;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .local-pay {
            margin-top: 15px;
            font-size: 0.95em;
            color: #444;
            background: #f1f8e9;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
