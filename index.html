<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #1a2a3a;
            margin-bottom: 15px;
        }
        p {
            line-height: 1.6;
            color: #555;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>¡Bienvenido a mi sitio web!</h1>
        <p>Aquí puedes agregar la información principal de tu página.</p>
    </div>

</body>
</html>
